[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drost-ai"
version = "1.0.0"
description = "Drost Community Edition: a container-native offensive security MCP toolkit"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["mcp", "security", "offensive-security", "security-automation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = [
  "mcp>=1.0",
  "playwright==1.55.0",
  "requests>=2.31",
]

[project.scripts]
drost-mcp = "drost_ai.server:main"

[tool.setuptools.packages.find]
where = ["src"]
