name: Publish container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a leading v
        required: true
        default: 1.0.0
        type: string
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: drost-ai/drost-community

jobs:
  prepare:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      major_minor: ${{ steps.release.outputs.major_minor }}
      major: ${{ steps.release.outputs.major }}

    steps:
      - name: Resolve release tags
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${REQUESTED_VERSION}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version such as 1.0.0; received: ${version}" >&2
            exit 1
          fi

          major="${version%%.*}"
          remainder="${version#*.}"
          minor="${remainder%%.*}"

          {
            echo "version=${version}"
            echo "major_minor=${major}.${minor}"
            echo "major=${major}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: amd64
          - platform: linux/arm64
            artifact: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reclaim runner disk space
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h /

          sudo rm -rf -- \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL

          echo "Disk space after cleanup:"
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=Drost Community Edition
            org.opencontainers.image.description=Container-native offensive security MCP toolkit
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }}
          provenance: mode=max
          # The full Kali SPDX document exceeds BuildKit's 80 MiB attestation limit.
          sbom: false

      - name: Export platform digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifest
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MAJOR_MINOR: ${{ needs.prepare.outputs.major_minor }}
          MAJOR: ${{ needs.prepare.outputs.major }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          references=()

          for digest_file in "${RUNNER_TEMP}/digests/"*; do
            references+=("${image}@sha256:$(basename "${digest_file}")")
          done

          if [[ "${#references[@]}" -ne 2 ]]; then
            echo "Expected two platform digests; found ${#references[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create \
            --tag "${image}:${VERSION}" \
            --tag "${image}:${MAJOR_MINOR}" \
            --tag "${image}:${MAJOR}" \
            --tag "${image}:latest" \
            "${references[@]}"

      - name: Inspect published manifest
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
